<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Visualiseur LiDAR — PyroVigil</title>
<style>
  :root { --dark:#141d28; --panel:rgba(20,29,40,.72); }
  * { margin:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; background:var(--dark); }
  #app { position:fixed; inset:0; }
  canvas { display:block; }
  .ui { position:absolute; font-family:'IBM Plex Mono', ui-monospace, monospace; color:#fff; }
  /* Légende classification */
  #legend { left:12px; bottom:12px; background:var(--panel); backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,.12); border-radius:10px; padding:10px 12px; }
  #legend h4 { font-size:10px; letter-spacing:.08em; text-transform:uppercase; opacity:.6; margin-bottom:7px; font-weight:600; }
  .row { display:flex; align-items:center; gap:8px; font-size:11px; line-height:1.9; }
  .sw { width:11px; height:11px; border-radius:2px; flex:none; }
  /* Bouton ortho */
  #ortho { right:12px; top:12px; background:var(--panel); backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,.14); border-radius:999px; color:#fff; cursor:pointer;
    font-family:inherit; font-size:11px; letter-spacing:.02em; padding:8px 14px; display:flex; align-items:center; gap:7px; }
  #ortho:hover { border-color:rgba(232,101,26,.7); }
  #ortho .dot { width:8px; height:8px; border-radius:50%; background:#6b7480; }
  #ortho.on .dot { background:#E8651A; }
  /* Hint */
  #hint { left:50%; bottom:14px; transform:translateX(-50%); background:var(--panel); backdrop-filter:blur(6px);
    border-radius:999px; padding:7px 13px; font-size:11px; display:flex; align-items:center; gap:7px;
    pointer-events:none; transition:opacity .5s; }
  #loading { inset:0; display:flex; align-items:center; justify-content:center; font-size:12px; letter-spacing:.05em; opacity:.7; }
</style>
</head>
<body>
<div id="app"></div>
<div id="loading" class="ui">Chargement du nuage de points…</div>
<div id="legend" class="ui" style="display:none"><h4>Classification LiDAR</h4><div id="legend-rows"></div></div>
<button id="ortho" class="ui" style="display:none"><span class="dot"></span>Fond ortho IGN</button>
<div id="hint" class="ui" style="display:none">
  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l-3 3 3 3M9 5l3-3 3 3M15 19l-3 3-3-3M19 9l3 3-3 3M2 12h20M12 2v20"/></svg>
  Faites glisser pour explorer
</div>

<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three'
import { OrbitControls } from './vendor/OrbitControls.js'

// Palette ASPRS (classification LiDAR)
const CLASS = {
  1: { c:'#9AA0A6', label:'Non classé' },
  2: { c:'#B07C4B', label:'Sol' },
  3: { c:'#B6D06A', label:'Végétation basse' },
  4: { c:'#6FB43A', label:'Végétation moyenne' },
  5: { c:'#2E7D32', label:'Végétation haute' },
  6: { c:'#E8651A', label:'Bâtiment' },
  9: { c:'#2E86C1', label:'Eau' },
}
const DEF = { c:'#9AA0A6', label:'Autre' }

const app = document.getElementById('app')
const renderer = new THREE.WebGLRenderer({ antialias:true })
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2))
renderer.setSize(app.clientWidth, app.clientHeight)
app.appendChild(renderer.domElement)

const scene = new THREE.Scene()
scene.background = new THREE.Color('#141d28')
scene.fog = new THREE.Fog('#141d28', 260, 620)

const camera = new THREE.PerspectiveCamera(52, app.clientWidth / app.clientHeight, 0.5, 4000)
camera.position.set(20, 95, 165) // vue aérienne inclinée

const controls = new OrbitControls(camera, renderer.domElement)
controls.enableDamping = true
controls.dampingFactor = 0.06
controls.autoRotate = true
controls.autoRotateSpeed = 0.55
controls.minDistance = 35
controls.maxDistance = 420
controls.maxPolarAngle = Math.PI * 0.49 // ne pas passer sous le sol
controls.target.set(0, 8, 0)

// Auto-rotation en pause pendant la manipulation, reprise après inactivité
let idleTimer = null
controls.addEventListener('start', () => { controls.autoRotate = false; clearTimeout(idleTimer) })
controls.addEventListener('end', () => { idleTimer = setTimeout(() => { controls.autoRotate = true }, 3500) })

let meta = null

async function load() {
  const [m, posBuf, clsBuf] = await Promise.all([
    fetch('./meta.json').then(r => r.json()),
    fetch('./positions.bin').then(r => r.arrayBuffer()),
    fetch('./classes.bin').then(r => r.arrayBuffer()),
  ])
  meta = m
  const positions = new Float32Array(posBuf)
  const classes = new Uint8Array(clsBuf)
  const n = classes.length

  const colors = new Float32Array(n * 3)
  const tmp = new THREE.Color()
  for (let i = 0; i < n; i++) {
    const info = CLASS[classes[i]] || DEF
    tmp.set(info.c)
    colors[i*3] = tmp.r; colors[i*3+1] = tmp.g; colors[i*3+2] = tmp.b
  }

  const geo = new THREE.BufferGeometry()
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3))
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3))
  const mat = new THREE.PointsMaterial({ size: 0.9, sizeAttenuation: true, vertexColors: true })
  scene.add(new THREE.Points(geo, mat))

  buildLegend(m.classes)
  document.getElementById('loading').style.display = 'none'
  document.getElementById('legend').style.display = ''
  document.getElementById('ortho').style.display = ''
  const hint = document.getElementById('hint')
  hint.style.display = ''
  ;['pointerdown','wheel','touchstart'].forEach(ev =>
    renderer.domElement.addEventListener(ev, () => { hint.style.opacity = '0' }, { once:true, passive:true }))
}

function buildLegend(hist) {
  const rows = document.getElementById('legend-rows')
  Object.keys(hist).map(Number).sort((a,b)=>a-b).forEach(k => {
    const info = CLASS[k] || DEF
    const el = document.createElement('div')
    el.className = 'row'
    el.innerHTML = `<span class="sw" style="background:${info.c}"></span>${info.label}`
    rows.appendChild(el)
  })
}

// ── Fond ortho IGN (plan texturé au sol) ──
let orthoMesh = null
const orthoBtn = document.getElementById('ortho')
orthoBtn.addEventListener('click', () => {
  if (orthoMesh) { orthoMesh.visible = !orthoMesh.visible; orthoBtn.classList.toggle('on', orthoMesh.visible); return }
  const [minx, miny, maxx, maxy] = meta.bbox2154
  const url = 'https://data.geopf.fr/wms-r/wms?SERVICE=WMS&VERSION=1.3.0&REQUEST=GetMap&STYLES=' +
    '&LAYERS=HR.ORTHOIMAGERY.ORTHOPHOTOS&CRS=EPSG:2154&FORMAT=image/jpeg&WIDTH=1024&HEIGHT=1024' +
    `&BBOX=${minx},${miny},${maxx},${maxy}`
  new THREE.TextureLoader().setCrossOrigin('anonymous').load(url, (tex) => {
    tex.colorSpace = THREE.SRGBColorSpace
    const [sx, sy] = meta.span
    const geo = new THREE.PlaneGeometry(sx, sy)
    const mat = new THREE.MeshBasicMaterial({ map: tex })
    orthoMesh = new THREE.Mesh(geo, mat)
    orthoMesh.rotation.x = -Math.PI / 2
    orthoMesh.position.y = -0.15 // juste sous le sol (z=minz)
    scene.add(orthoMesh)
    orthoBtn.classList.add('on')
  })
})

function resize() {
  const w = app.clientWidth, h = app.clientHeight
  renderer.setSize(w, h)
  camera.aspect = w / h
  camera.updateProjectionMatrix()
}
window.addEventListener('resize', resize)

function animate() {
  requestAnimationFrame(animate)
  controls.update()
  renderer.render(scene, camera)
}
animate()
load().catch(() => { document.getElementById('loading').textContent = 'Erreur de chargement du nuage.' })
</script>
</body>
</html>
